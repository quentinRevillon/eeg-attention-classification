<!DOCTYPE html>
<html>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='leaderboard.css') }}">
<head>
    <title>Leaderboard</title>
</head>
<body>
    <h1>Leaderboard</h1>
    <table>
        <tr>
            <th>Email</th>
            <th>Score</th>
        </tr>
        {% for result in results %}
        <tr>
            <td>{{ result.email }}</td>
            <td>{{ result.reactionTime }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
