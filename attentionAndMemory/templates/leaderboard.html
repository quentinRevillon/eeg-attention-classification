<!DOCTYPE html>
<html>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='leaderboard.css') }}">
<head>
    <title>Leaderboard</title>
</head>
<body>
    <h1>Leaderboard</h1>
    <table>
        <tr>
            <th>Email</th>
            <th>Average reaction time</th>
        </tr>
        {% for result in results %}
        <tr>
            <td>{{ result.email }}</td>
            <td>{{ '{:.2f}'.format(result.average_reaction_time) }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
