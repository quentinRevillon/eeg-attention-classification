<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Memory Game</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game1">
        <h2>GAME 1</h2>
        <div id="phase1">
            <h2>Phase 1: Memorize the Image</h2>
            <div class="image-container">
            <!-- Images will be loaded here via JavaScript -->
            <button onclick="ChangerImage1()">Start Phase 1</button>
            <img id="monimage" src="./images/croix.webp" width="200" height="200"/>
            </div>    
        </div>
        <div id="phase2" style="display:none;">
        <button id="nextPhase" onclick="displayFirstImage()">Start Phase 2</button>
            <!-- Images for phase 2 will be loaded here -->
            <h2>Phase 2: Recall the Image</h2>
            <div class="image-container">
            <!-- Images will be loaded here via JavaScript -->
            <img id="currentImage" src="./images/croix.webp" width="200" height="200"/>
            <div class="buttons">
                <button id="seen" onclick = "IncrementScoreSeen()">Seen</button>
                <button id="unknown" onclick = "IncrementScoreUnknown()">Unknown</button>
            </div>
            </div> 
        </div>
    </div>

    <div id="game2">
        <h2>GAME 2</h2>
        <div id="phase3">
        <h2>Phase 1: Mesure the number of Words for Phase 2</h2>
        <button id="NumWords" onclick="askNumWords()">Number of words</button>
        <button id="StartPhase1" onclick="displaySentencePhase1()">Start Phase 1</button>
        <p id="sentence"></p>
        <div id="submissionPhase1" style="display:none;">
        <form id="form">
            <input type="text" id="input1" />
            <button type="submitButton1" type="submit">Submit</button>
        </form>
        <p id="result1"></p>
        </div>
        </div>

        <div id = "phase4" style="display:none;">
            <h2>Phase 2</h2>
            <button id="Phase4" onclick="askNumWords()">Number of Words</button>
            <button id="StartPhase2" onclick="startPhase2(event)">Start Game</button>
            <p id="sentence2"> </p>
            <div id="submissionPhase" style="display:none;">
            <form id="form">
                <input type="text" id="input2" />
                <button id="submitButton2" type="button">Submit</button>
            </form>
            <p id="result2"></p>
        </div>
    </div>

        <script src = "app.js"></script>

</body>
</html>
