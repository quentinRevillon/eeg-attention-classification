<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Memory Game</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game1">
        <h2>GAME 1</h2>
        <div id="phase1">
            <h2>Phase 1: Memorize the Image</h2>
            <div class="image-container">
            <!-- Images will be loaded here via JavaScript -->
            <button onclick="ChangerImage1()">Start Phase 1</button>
            <img id="monimage" src="croix.webp" width="200" height="200"/>
            </div>    
        </div>
        <div id="phase2" style="display:none;">
        <button id="nextPhase" onclick="displayFirstImage()">Start Phase 2</button>
            <!-- Images for phase 2 will be loaded here -->
            <h2>Phase 2: Recall the Image</h2>
            <div class="image-container">
            <!-- Images will be loaded here via JavaScript -->
            <img id="currentImage" src="croix.webp" width="200" height="200"/>
            <button id="seen" onclick = "IncrementScoreSeen()">Seen</button>
            <button id="unknown" onclick = "IncrementScoreUnknown()">Unknown</button>
            </div> 
        </div>
    </div>

    
      <div id = "game2">
        <h2>GAME 2</h2>
        <div id = "phase3">

            <h2>Phase 1 : Memorise the sequences</h2>
            <button id="firstsequence" onclick="ChangeSequence()">Phase 1</button>
            <div id="sequenceContainer"></div>
            </div>
        <div id = "phase4" >
            <h2>Phase 2 : Recall Sequences</h2>
            <div id="userInputContainer">
                <label for = "userInput">Enter the sequence:</label>
                <input type="text" id="userInput" name="userInput">
                <button id = "secondsequence" onclick="checkSequence()">Submit</button>
                <p id="resultMessage"></p>
            </div>
        </div>
        </div>
    </div>
        <script src = "app.js"></script>
</body>
</html>
